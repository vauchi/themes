workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"

variables:
  VAUCHI_SCRIPTS_REF: "ci-templates-v2026.07.1"
  GIT_STRATEGY: clone

default:
  interruptible: true

include:
  - project: 'vauchi/scripts'
    ref: ci-templates-v2026.07.1
    file:
      - '/ci-templates/reuse.yml'
      - '/ci-templates/badges.yml'
      - '/ci-templates/github-mirror.yml'

stages:
  - lint
  - validate
  - generate
  - contract
  - trigger
  - deploy

# Validate JSON syntax (fast gate — catches malformed files before Python)
lint:json:
  stage: lint
  tags:
    - self-hosted
    - node
  needs: []
  script:
    - jq empty themes.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - themes.json

validate:themes:
  stage: validate
  tags:
    - self-hosted
    - node
  needs:
    - job: lint:json
      optional: true
  script:
    - python3 scripts/validate.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - themes.json
        - themes.schema.json
        - scripts/validate.py

validate:themes-strict:
  stage: validate
  tags:
    - self-hosted
    - node
  needs:
    - job: lint:json
      optional: true
  script:
    - python3 scripts/validate.py --strict
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - themes.json
        - themes.schema.json
        - scripts/validate.py
  allow_failure: false

# Run generator tests
test:generator:
  stage: generate
  tags:
    - self-hosted
    - node
  needs:
    - job: validate:themes
      optional: true
  script:
    - python3 -m unittest scripts.test_generate -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - themes.json
        - tokens.json
        - scripts/generate.py
        - scripts/test_generate.py

# Generate platform outputs
generate:tokens:
  stage: generate
  tags:
    - self-hosted
    - node
  needs:
    - job: validate:themes
      optional: true
  script:
    - python3 scripts/generate.py
  artifacts:
    paths:
      - generated/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - themes.json
        - tokens.json
        - scripts/generate.py

# Check schema backward compatibility (detects breaking changes vs main)
check:schema-compat:
  stage: contract
  tags:
    - self-hosted
    - node
  needs:
    - job: validate:themes
      optional: true
  allow_failure: true  # Breaking changes are expected during L2a schema migration
  script:
    - git fetch origin main --depth=1
    - python3 scripts/check-schema-compat.py --baseline main --schema themes.schema.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - themes.schema.json

# Validate themes.json against core's parser contract
check:core-contract:
  stage: contract
  tags:
    - self-hosted
    - node
  needs:
    - job: lint:json
      optional: true
  script:
    - python3 scripts/check-core-contract.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - themes.json
        - tokens.json
        - scripts/check-core-contract.py

# ============================================================
# Trigger Stage — Cross-Project Contract Validation (C4)
# ============================================================

# When themes.json merges to main, trigger core's contract tests
# to verify core's parser still accepts the new content.
trigger:core-validate:
  stage: trigger
  needs:
    - job: validate:themes-strict
      optional: true
  trigger:
    project: vauchi/core
    strategy: depend
  variables:
    CONTENT_TRIGGER_REPO: themes
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - themes.json
        - tokens.json
        - themes.schema.json

# ============================================================
# Deploy Stage — Badge Pages
# ============================================================

pages:
  extends: .badges-pages

github-mirror:
  extends: .github-mirror
